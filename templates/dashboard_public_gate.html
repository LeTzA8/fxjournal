{% extends "base.html" %}

{% block content %}
<section class="auth-shell">
    <div class="auth-topbar">
        <a href="{{ url_for('landing') }}" class="auth-topbar-brand" aria-label="Go to landing page">
            <img
                src="{{ url_for('static', filename='site-logo.png') }}"
                alt="MyFXJournal Logo"
                class="auth-topbar-logo"
            >
            <span>MyFXJournal</span>
        </a>
        <div class="auth-topbar-links">
            <a href="{{ url_for('landing') }}" class="auth-topbar-link ghost">Back to Landing</a>
        </div>
    </div>
    <div class="login-card">
        <p class="eyebrow">Trading dashboard</p>
        <h1>Sign in to open your dashboard</h1>
        <p class="subtext">Trade history, analytics, MT5 sync status, and your weekly AI review — all account-scoped.</p>
        <form action="{{ url_for('login') }}" method="get" class="login-form">
            <button type="submit">Sign in</button>
        </form>
        <p class="switch-link">No account yet? <a href="{{ url_for('register') }}">Create one</a></p>
    </div>
</section>

{% endblock %}
