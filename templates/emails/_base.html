<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <meta name="supported-color-schemes" content="light" />
  <meta name="x-apple-disable-message-reformatting" />
  <title>{{ title|default("MyFXJournal") }}</title>
  <style>
    :root {
      color-scheme: light;
      supported-color-schemes: light;
    }

    body,
    .email-bg,
    .email-shell {
      background-color: #f4f7fb !important;
      color: #182538 !important;
    }

    .email-card {
      background-color: #ffffff !important;
      border: 1px solid #dce4f0 !important;
      border-radius: 16px !important;
    }

    .email-surface {
      background-color: #eef4ff !important;
      border: 1px solid #dce4f0 !important;
    }

    .email-preview-card {
      background-color: #f7faff !important;
      border: 1px solid #dce4f0 !important;
      border-left: 3px solid #3658e8 !important;
      border-radius: 12px !important;
    }

    .email-stat-card {
      background-color: #f7faff !important;
      border: 1px solid #dce4f0 !important;
      border-radius: 12px !important;
    }

    .email-text {
      color: #182538 !important;
    }

    .email-muted {
      color: #66758f !important;
    }

    .email-accent {
      color: #3658e8 !important;
    }

    .email-divider {
      background-color: #dce4f0 !important;
    }

    .email-button-cell {
      background-color: #3658e8 !important;
      border-radius: 10px !important;
    }

    .email-button-link {
      display: block !important;
      padding: 14px 36px !important;
      border: 1px solid #3658e8 !important;
      border-radius: 10px !important;
      color: #ffffff !important;
      font-size: 15px !important;
      font-weight: 700 !important;
      letter-spacing: 0.2px !important;
      text-decoration: none !important;
    }

    .email-logo-wrap {
      display: inline-block;
      padding: 10px 18px;
      border: 1px solid #dce4f0;
      border-radius: 999px;
      background-color: #ffffff;
    }

    a[x-apple-data-detectors],
    #MessageViewBody a,
    u + .body a {
      color: inherit !important;
      text-decoration: none !important;
      font: inherit !important;
    }
  </style>
</head>
<body class="body email-bg" style="margin:0;padding:0;background-color:#f4f7fb;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;">
  {% if preheader %}
  <div style="display:none;font-size:1px;color:#f4f7fb;line-height:1px;max-height:0px;max-width:0px;opacity:0;overflow:hidden;">
    {{ preheader }}
  </div>
  {% endif %}
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="email-bg email-shell" bgcolor="#f4f7fb" style="background-color:#f4f7fb;padding:40px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;width:100%;">
          <tr>
            <td style="padding-bottom:32px;" align="center">
              <div class="email-logo-wrap" style="display:inline-block;padding:10px 18px;border:1px solid #dce4f0;border-radius:999px;background-color:#ffffff;">
                <img src="{{ logo_url }}" alt="MyFXJournal" height="36" style="display:block;" />
              </div>
            </td>
          </tr>
          <tr>
            <td class="email-card" bgcolor="#ffffff" style="background-color:#ffffff;border-radius:16px;padding:40px 36px;border:1px solid #dce4f0;">
              {% block card_content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding-top:28px;" align="center">
              {% block footer %}
              <p class="email-muted" style="margin:0;font-size:12px;color:#66758f;">
                <a href="{{ site_url|default('https://myfxjournal.com') }}" class="email-accent" style="color:#3658e8;text-decoration:none;">{{ site_label|default("myfxjournal.com") }}</a>
                &nbsp;&middot;&nbsp;
                <a href="mailto:{{ support_email|default('support@myfxjournal.com') }}" class="email-muted" style="color:#66758f;text-decoration:none;">{{ support_email|default("support@myfxjournal.com") }}</a>
              </p>
              {% endblock %}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
