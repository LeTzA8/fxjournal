<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <meta name="supported-color-schemes" content="light" />
  <meta name="x-apple-disable-message-reformatting" />
  <title>{{ title }}</title>
  <style>
    :root {
      color-scheme: light;
      supported-color-schemes: light;
    }

    body,
    .email-bg,
    .email-shell {
      background-color: #f4f7fb !important;
      color: #182538 !important;
    }

    .email-card {
      background-color: #ffffff !important;
      border: 1px solid #dce4f0 !important;
      border-radius: 16px !important;
    }

    .email-surface {
      background-color: #eef4ff !important;
      border: 1px solid #dce4f0 !important;
    }

    .email-text {
      color: #182538 !important;
    }

    .email-muted {
      color: #66758f !important;
    }

    .email-accent {
      color: #3658e8 !important;
    }

    .email-divider {
      background-color: #dce4f0 !important;
    }

    .email-button-cell {
      background-color: #3658e8 !important;
      border-radius: 10px !important;
    }

    .email-button-link {
      display: block !important;
      padding: 14px 36px !important;
      border: 1px solid #3658e8 !important;
      border-radius: 10px !important;
      color: #ffffff !important;
      font-size: 15px !important;
      font-weight: 700 !important;
      letter-spacing: 0.2px !important;
      text-decoration: none !important;
    }

    .email-logo-wrap {
      display: inline-block;
      padding: 10px 18px;
      border: 1px solid #dce4f0;
      border-radius: 999px;
      background-color: #ffffff;
    }

    a[x-apple-data-detectors],
    #MessageViewBody a,
    u + .body a {
      color: inherit !important;
      text-decoration: none !important;
      font: inherit !important;
    }
  </style>
</head>
<body class="body email-bg" style="margin:0;padding:0;background-color:#f4f7fb;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="email-bg email-shell" bgcolor="#f4f7fb" style="background-color:#f4f7fb;padding:40px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;width:100%;">
          <tr>
            <td style="padding-bottom:32px;" align="center">
              <div class="email-logo-wrap" style="display:inline-block;padding:10px 18px;border:1px solid #dce4f0;border-radius:999px;background-color:#ffffff;">
                <img src="{{ logo_url }}" alt="MyFXJournal" height="36" style="display:block;" />
              </div>
            </td>
          </tr>
          <tr>
            <td class="email-card" bgcolor="#ffffff" style="background-color:#ffffff;border-radius:16px;padding:40px 36px;border:1px solid #dce4f0;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-bottom:24px;">
                <tr>
                  <td align="center">
                    <div class="email-surface email-accent" style="display:inline-block;padding:10px 14px;border-radius:999px;background-color:#eef4ff;border:1px solid #dce4f0;font-size:12px;font-weight:700;letter-spacing:0.7px;text-transform:uppercase;color:#3658e8;">{{ badge_label }}</div>
                  </td>
                </tr>
              </table>
              <p class="email-text" style="margin:0 0 8px 0;font-size:24px;font-weight:700;color:#182538;letter-spacing:-0.3px;text-align:center;">{{ heading }}</p>
              <p class="email-muted" style="margin:0 0 28px 0;font-size:15px;color:#66758f;line-height:1.7;text-align:center;">{{ intro }}</p>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-bottom:28px;">
                <tr>
                  <td align="center">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td class="email-button-cell" bgcolor="#3658e8" align="center" style="background-color:#3658e8;border-radius:10px;">
                          <a href="{{ confirm_url }}" class="email-button-link" style="display:block;padding:14px 36px;border:1px solid #3658e8;border-radius:10px;color:#ffffff;font-size:15px;font-weight:700;text-decoration:none;letter-spacing:0.2px;">{{ button_label }}</a>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-bottom:20px;">
                <tr><td class="email-divider" style="height:1px;background-color:#dce4f0;"></td></tr>
              </table>
              <p class="email-muted" style="margin:0 0 8px 0;font-size:13px;color:#66758f;text-align:center;line-height:1.6;">{{ detail }}</p>
              <p class="email-muted" style="margin:0;font-size:13px;color:#66758f;text-align:center;line-height:1.6;">{{ footer_note }}</p>
            </td>
          </tr>
          <tr>
            <td style="padding-top:28px;" align="center">
              <p class="email-muted" style="margin:0;font-size:12px;color:#66758f;">
                <a href="https://myfxjournal.com" class="email-accent" style="color:#3658e8;text-decoration:none;">myfxjournal.com</a>
                &nbsp;&middot;&nbsp;
                <a href="mailto:support@myfxjournal.com" class="email-muted" style="color:#66758f;text-decoration:none;">support@myfxjournal.com</a>
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
