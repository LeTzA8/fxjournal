{% extends "emails/_base.html" %}

{% block card_content %}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-bottom:24px;">
  <tr>
    <td align="center">
      <div class="email-surface email-accent" style="display:inline-block;padding:10px 14px;border-radius:999px;background-color:#eef4ff;border:1px solid #dce4f0;font-size:12px;font-weight:700;letter-spacing:0.7px;text-transform:uppercase;color:#3658e8;">{{ badge_label }}</div>
    </td>
  </tr>
</table>
<p class="email-text" style="margin:0 0 8px 0;font-size:24px;font-weight:700;color:#182538;letter-spacing:-0.3px;text-align:center;">{{ heading }}</p>
<p class="email-muted" style="margin:0 0 28px 0;font-size:15px;color:#66758f;line-height:1.7;text-align:center;">{{ intro }}</p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-bottom:28px;">
  <tr>
    <td align="center">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td class="email-button-cell" bgcolor="#3658e8" align="center" style="background-color:#3658e8;border-radius:10px;">
            <a href="{{ confirm_url }}" class="email-button-link" style="display:block;padding:14px 36px;border:1px solid #3658e8;border-radius:10px;color:#ffffff;font-size:15px;font-weight:700;text-decoration:none;letter-spacing:0.2px;">{{ button_label }}</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-bottom:20px;">
  <tr><td class="email-divider" style="height:1px;background-color:#dce4f0;"></td></tr>
</table>
<p class="email-muted" style="margin:0 0 8px 0;font-size:13px;color:#66758f;text-align:center;line-height:1.6;">{{ detail }}</p>
<p class="email-muted" style="margin:0;font-size:13px;color:#66758f;text-align:center;line-height:1.6;">{{ footer_note }}</p>
{% endblock %}
